switch:
  - platform: template
    switches:
      dummy_switch:
        unique_id: "dummy_switch"
        friendly_name: "Dummy Switch"
        value_template: "{{ is_state('switch.dummy_switch', 'on') }}"
        turn_on:
          - service: switch.turn_on
            entity_id: switch.dummy_switch
        turn_off:
          - service: switch.turn_off
            entity_id: switch.dummy_switch
        icon_template: >
          {% if is_state('switch.dummy_switch', 'on') %}
            mdi:toggle-switch
          {% else %}
            mdi:toggle-switch-off
          {% endif %}
