light:
  - platform: template
    lights:
      dummy_light:
        unique_id: "dummy_light"
        friendly_name: "Dummy Light"
        value_template: "{{ is_state('input_boolean.dummy_light', 'on') }}"
        turn_on:
          - service: input_boolean.turn_on
            entity_id: input_boolean.dummy_light
        turn_off:
          - service: input_boolean.turn_off
            entity_id: input_boolean.dummy_light
