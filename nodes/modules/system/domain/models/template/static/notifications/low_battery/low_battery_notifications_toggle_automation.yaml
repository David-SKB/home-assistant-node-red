automation:
  - id: low_battery_notifications_toggle
    alias: "Low Battery Notifications Toggle"
    trigger:
      - platform: state
        entity_id: input_select.low_battery_notifications_mode
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state in ['ON', 'OFF', 'WARNINGS'] }}
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.low_battery_notifications_mode
                state: "ON"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.low_battery_notifications
          - conditions:
              - condition: state
                entity_id: input_select.low_battery_notifications_mode
                state: "OFF"
            sequence:
              - service: automation.turn_off
                target:
                  entity_id: automation.low_battery_notifications
          - conditions:
              - condition: state
                entity_id: input_select.low_battery_notifications_mode
                state: "WARNINGS"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.low_battery_notifications
