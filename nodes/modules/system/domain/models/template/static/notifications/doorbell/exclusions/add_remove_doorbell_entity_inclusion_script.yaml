script:
  add_doorbell_entity_inclusion:
    alias: "Add Doorbell Entity Inclusion"
    sequence:
      - variables:
          new_inclusion: "{{ states('input_text.doorbell_entity_exclusions_state') }}"
          current_inclusions: "{{ states('input_text.doorbell_entity_inclusions') | default('') }}"
      - condition: template
        value_template: "{{ new_inclusion != '' and new_inclusion not in current_inclusions.split(',') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.doorbell_entity_inclusions
        data:
          value: >
            {% set inclusions = current_inclusions.split(',') | reject('equalto', '') | reject('equalto', 'unknown') | list %}
            {{ (inclusions + [new_inclusion]) | join(',') }}

  remove_doorbell_entity_inclusion:
    alias: "Remove Doorbell Entity Inclusion"
    sequence:
      - variables:
          removal_target: "{{ states('input_text.doorbell_entity_inclusions_state') }}"
          current_inclusions: "{{ states('input_text.doorbell_entity_inclusions') | default('') }}"
      - condition: template
        value_template: "{{ removal_target in current_inclusions.split(',') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.doorbell_entity_inclusions
        data:
          value: >
            {% set inclusions = current_inclusions.split(',') | reject('equalto', removal_target) | list %}
            {{ inclusions | join(',') }}