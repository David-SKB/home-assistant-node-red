script:
  add_low_battery_device_exclusion:
    alias: "Add Low Battery Device Exclusion"
    sequence:
      - variables:
          new_exclusion: "{{ states('input_text.low_battery_device_inclusions_state') }}"
          current_exclusions: "{{ states('input_text.low_battery_device_exclusions') | default('') }}"
      - condition: template
        value_template: "{{ new_exclusion != '' and new_exclusion not in current_exclusions.split(',') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.low_battery_device_exclusions
        data:
          value: >
            {% set exclusions = current_exclusions.split(',') | reject('equalto', '') | list %}
            {{ (exclusions + [new_exclusion]) | join(',') }}

  remove_low_battery_device_exclusion:
    alias: "Remove Low Battery Device Exclusion"
    sequence:
      - variables:
          removal_target: "{{ states('input_text.low_battery_device_exclusions_state') }}"
          current_exclusions: "{{ states('input_text.low_battery_device_exclusions') | default('') }}"
      - condition: template
        value_template: "{{ removal_target in current_exclusions.split(',') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.low_battery_device_exclusions
        data:
          value: >
            {% set exclusions = current_exclusions.split(',') | reject('equalto', removal_target) | list %}
            {{ exclusions | join(',') }}
