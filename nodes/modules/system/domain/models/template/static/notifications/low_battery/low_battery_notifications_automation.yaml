automation:
  - id: low_battery_notifications
    alias: "Low Battery Notifications"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.system_configuration_updated
      - platform: state
        entity_id: input_button.send_low_battery_notifications
      - platform: state
        entity_id: sensor.low_battery_devices
    condition:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ state_attr('sensor.low_battery_devices', 'devices') | length > 0 }}"
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ state_attr('sensor.low_battery_devices', 'devices') | length == 0 }}"
              - condition: template
                value_template: >
                  {{ (state_attr('input_select.low_battery_notifications', 'options') | reject('equalto', 'None') | list) | length > 0 }}
    action:
      - delay: "00:00:01"
      - variables:
          exclusions: >
            {{ (states('input_text.low_battery_devices_exclusions') | default('')).split(',') }}
          low_battery_devices: >
            {{ state_attr('sensor.low_battery_devices', 'devices') }}
          alert_threshold: "{{ states('input_number.low_battery_alert_threshold') | int }}"
          warning_threshold: "{{ states('input_number.low_battery_warning_threshold') | int }}"

      - repeat:
          for_each: "{{ low_battery_devices }}"
          sequence:
            - variables:
                device_slug: "{{ repeat.item.device_name | slugify }}"
                battery_level: "{{ repeat.item.battery_level }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ states('input_select.low_battery_notifications_mode') == 'ON' }}
                    - condition: template
                      value_template: >
                        {{ battery_level < alert_threshold }}
                  sequence:
                    - service: persistent_notification.create
                      data:
                        message: >
                          Battery alert! The battery of device **{{ repeat.item.device_name }}** is below the threshold.
                          Current battery level: **{{ battery_level }}%**.
                          Please recharge it soon.
                        title: Low Battery Alert - {{ repeat.item.device_name }}
                        notification_id: low_battery_notification_{{ device_slug }}
                    - service: input_select.set_options
                      data:
                        entity_id: input_select.low_battery_notifications
                        options: >
                          {% set current_notifications = state_attr('input_select.low_battery_notifications', 'options') | default([]) %}
                          {% set updated_notifications = (current_notifications | reject('equalto', 'None') | list) %}
                          {% set new_notifications = updated_notifications + [repeat.item.device_name] %}
                          {% set filtered_notifications = new_notifications | unique | list %}
                          {% if filtered_notifications | length == 0 %}
                            ['None']
                          {% else %}
                            {{ filtered_notifications }}
                          {% endif %}
            - delay: "00:00:01"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ states('input_select.low_battery_notifications_mode') in ['ON', 'WARNINGS'] }}
                    - condition: template
                      value_template: >
                        {{ battery_level < warning_threshold }}
                  sequence:
                    - service: persistent_notification.create
                      data:
                        message: >
                          Battery warning! The battery of device **{{ repeat.item.device_name }}** is below the warning threshold.
                          Current battery level: **{{ battery_level }}%**.
                          Consider recharging soon.
                        title: Low Battery Warning - {{ repeat.item.device_name }}
                        notification_id: low_battery_notification_{{ device_slug }}
                    - delay: "00:00:01"
                    - service: notify.mobile_app
                      data_template:
                        message: >
                          Battery warning! The battery of device **{{ repeat.item.device_name }}** is below the warning threshold.
                          Current battery level: **{{ battery_level }}%**.
                          Consider recharging soon.
                        title: Low Battery Warning - {{ repeat.item.device_name }}

      - repeat:
          for_each: >
            {{ state_attr('input_select.low_battery_notifications', 'options') | default([]) }}
          sequence:
            - variables:
                device_name: "{{ repeat.item }}"
                device_slug: "{{ repeat.item | slugify }}"
            - condition: template
              value_template: >
                {{ device_name not in (low_battery_devices | map(attribute='device_name') | list) }}
            - service: persistent_notification.dismiss
              data:
                notification_id: low_battery_notification_{{ device_slug }}
            - service: input_select.set_options
              data:
                entity_id: input_select.low_battery_notifications
                options: >
                  {% set current_notifications = state_attr('input_select.low_battery_notifications', 'options') | default([]) %}
                  {% set updated_notifications = current_notifications | reject('equalto', device_name) | list %}
                  {% if updated_notifications | length == 0 %}
                    ['None']
                  {% else %}
                    {{ updated_notifications }}
                  {% endif %}