switch:
  - platform: template
    switches:
      occupancy_mode_unoccupied:
        unique_id: "occupancy_mode_unoccupied"
        friendly_name: "Occupancy Mode Unoccupied"
        value_template: "{{ is_state('select.occupancy_mode', 'UNOCCUPIED') }}"
        turn_on:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: UNOCCUPIED
        turn_off:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: UNKNOWN
        icon_template: mdi:home-export-outline