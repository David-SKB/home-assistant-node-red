switch:
  - platform: template
    switches:
      occupancy_mode_bypass:
        unique_id: "occupancy_mode_bypass"
        friendly_name: "Occupancy Mode Bypass"
        value_template: "{{ is_state('select.occupancy_mode', 'BYPASS') }}"
        turn_on:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: BYPASS
        turn_off:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: UNKNOWN
        icon_template: mdi:motion-pause-outline
