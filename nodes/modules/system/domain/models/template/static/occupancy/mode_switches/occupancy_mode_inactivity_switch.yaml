switch:
  - platform: template
    switches:
      occupancy_mode_inactivity:
        unique_id: "occupancy_mode_inactivity"
        friendly_name: "Occupancy Mode Inactivity"
        value_template: "{{ is_state('select.occupancy_mode', 'INACTIVITY') }}"
        turn_on:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: INACTIVITY
        turn_off:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: UNKNOWN
        icon_template: mdi:sleep