switch:
  - platform: template
    switches:
      occupancy_mode_occupied:
        unique_id: "occupancy_mode_occupied"
        friendly_name: "Occupancy Mode Occupied"
        value_template: "{{ is_state('select.occupancy_mode', 'OCCUPIED') }}"
        turn_on:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: OCCUPIED
        turn_off:
          - service: select.select_option
            entity_id: select.occupancy_mode
            data:
              option: UNKNOWN
        icon_template: mdi:home-sound-out