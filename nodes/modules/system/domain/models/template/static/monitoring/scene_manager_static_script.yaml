script:
  scene_manager_static:
    alias: "Scene Manager Static"
    description: "Script to manage scenes dynamically."
    fields:
      action:
        selector:
          select:
            multiple: false
            options:
              - save
              - restore
        name: Action
        required: true
      scene_id:
        selector:
          text: null
        name: Scene ID
        required: true
      snapshot_entities:
        selector:
          target: null
        name: Snapshot Entities
        required: false
      domains:
        selector:
          select:
            multiple: true
            options:
              - person
              - update
              - binary_sensor
              - sensor
              - switch
              - input_number
              - input_button
              - zone
              - input_text
              - timer
              - input_select
              - input_boolean
              - conversation
              - light
              - input_datetime
              - sun
              - schedule
              - device_tracker
              - calendar
              - media_player
              - script
              - remote
              - weather
              - automation
              - button
              - select
              - number
              - scene
        name: Domains
        required: false
    sequence:
      - variables:
          resolved_action: "{{ action | lower }}"
          resolved_scene_id: "{{ scene_id }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ resolved_action == 'save' }}"
            sequence:
              - service: script.convert_target_to_entities
                data:
                  target: "{{ snapshot_entities }}"
                response_variable: resolved_snapshot
              - variables:
                  snapshot_entities: >
                    {{ resolved_snapshot.resolved_entities | default([]) }}
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ snapshot_entities | length == 0 }}"
                    sequence:
                      - service: persistent_notification.create
                        data:
                          message: "No entities were resolved for snapshot."
                          title: "Scene Manager Error"
              - service: scene.create
                data:
                  scene_id: "{{ resolved_scene_id }}"
                  snapshot_entities: "{{ snapshot_entities }}"
          - conditions:
              - condition: template
                value_template: "{{ resolved_action == 'restore' }}"
            sequence:
              - service: scene.turn_on
                target:
                  entity_id: "scene.{{ resolved_scene_id }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ resolved_action not in ['save', 'restore'] }}"
            sequence:
              - service: persistent_notification.create
                data:
                  message: "Invalid action '{{ resolved_action }}'. Use 'save' or 'restore'."
                  title: "Scene Manager Error"
