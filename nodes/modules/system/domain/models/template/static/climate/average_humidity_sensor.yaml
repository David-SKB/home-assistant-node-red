template:
  - sensor:
      - name: "Average Humidity"
        unique_id: "average_humidity"
        icon: "mdi:water-percent"
        unit_of_measurement: "°C"
        device_class: "humidity"
        state: >-
          {% set sensor_list = state_attr('sensor.humidity_sensors', 'tracked_sensors')  | default([]) %}
          {% if sensor_list %}
            {% set sensor_values = sensor_list
              | map('states')
              | reject('none')
              | reject('in', ['unknown', 'unavailable'])
              | map('float')
              | list %}
            {% if sensor_values %}
              {{ (sensor_values | sum / sensor_values | length) | round(1) }}
            {% else %}
              {{ None }}
            {% endif %}
          {% else %}
            {{ None }}
          {% endif %}
        attributes:
          sensor_count: >
            {% set humidity_sensors = state_attr('sensor.humidity_sensors', 'tracked_sensors') | default([]) %}
            {% if humidity_sensors is not none %}
              {{ humidity_sensors | length }}
            {% else %}
              0
            {% endif %}
