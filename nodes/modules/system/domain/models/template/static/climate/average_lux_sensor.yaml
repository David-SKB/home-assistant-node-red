template:
  - sensor:
      - name: "Average Lux"
        unique_id: "average_lux"
        icon: "mdi:weather-sunny"
        unit_of_measurement: "lx"
        device_class: "illuminance"
        state: >-
          {% set sensor_list = state_attr('sensor.lux_sensors', 'tracked_sensors')  | default([]) %}
          {% if sensor_list %}
            {% set sensor_values = sensor_list
              | map('states')
              | reject('none')
              | reject('in', ['unknown', 'unavailable'])
              | map('float')
              | list %}
            {% if sensor_values %}
              {{ (sensor_values | sum / sensor_values | length) | round(1) }}
            {% else %}
              {{ None }}
            {% endif %}
          {% else %}
            {{ None }}
          {% endif %}
        attributes:
          sensor_count: >
            {% set lux_sensors = state_attr('sensor.lux_sensors', 'tracked_sensors') | default([]) %}
            {% if lux_sensors is not none %}
              {{ lux_sensors | length }}
            {% else %}
              0
            {% endif %}
