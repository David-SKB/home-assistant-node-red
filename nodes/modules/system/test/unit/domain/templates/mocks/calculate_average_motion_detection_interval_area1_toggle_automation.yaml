automation:
  - id: calculate_average_motion_detection_interval_area1_toggle
    alias: "Calculate Average Motion Detection Interval Area 1 Toggle"
    trigger:
      - platform: state
        entity_id: input_select.motion_lighting_mode_area1
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state in ['AUTO', 'TOGGLE', 'DIM', 'HYBRID'] }}
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.motion_lighting_mode_area1
                state: "AUTO"
            sequence:
              - service: automation.turn_on
                target:
                  entity_id: automation.calculate_average_motion_detection_interval_area1
          - conditions:
              - condition: state
                entity_id: input_select.motion_lighting_mode_area1
                state: "TOGGLE"
            sequence:
              - service: automation.turn_off
                target:
                  entity_id: automation.calculate_average_motion_detection_interval_area1
          - conditions:
              - condition: state
                entity_id: input_select.motion_lighting_mode_area1
                state: "DIM"
            sequence:
              - service: automation.turn_off
                target:
                  entity_id: automation.calculate_average_motion_detection_interval_area1
          - conditions:
              - condition: state
                entity_id: input_select.motion_lighting_mode_area1
                state: "HYBRID"
            sequence:
              - service: automation.turn_off
                target:
                  entity_id: automation.calculate_average_motion_detection_interval_area1
