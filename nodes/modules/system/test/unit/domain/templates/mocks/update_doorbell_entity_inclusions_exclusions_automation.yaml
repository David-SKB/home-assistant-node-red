automation:
  - id: update_doorbell_entity_inclusions
    alias: "Update Doorbell Entity Inclusions"
    trigger:
      - platform: state
        entity_id: input_button.add_doorbell_entity_inclusion
        id: "ADD"
      - platform: state
        entity_id: input_button.remove_doorbell_entity_inclusion
        id: "REMOVE"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: "ADD"
            sequence:
              - service: script.add_inclusion_exclusion_entity
                data:
                  entity_inclusion_exclusion_state: input_text.doorbell_entity_exclusions_state
                  entity_inclusions_exclusions: input_text.doorbell_entity_inclusions
          - conditions:
              - condition: trigger
                id: "REMOVE"
            sequence:
              - service: script.remove_inclusion_exclusion_entity
                data:
                  entity_inclusion_exclusion_state: input_text.doorbell_entity_inclusions_state
                  entity_inclusions_exclusions: input_text.doorbell_entity_inclusions
    mode: single