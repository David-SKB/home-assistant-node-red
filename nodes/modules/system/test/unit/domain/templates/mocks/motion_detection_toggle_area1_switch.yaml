switch:
  - platform: template
    switches:
      motion_detection_toggle_area1:
        unique_id: "motion_detection_toggle_area1"
        friendly_name: "Motion Detection Toggle Area 1"
        value_template: "{{ is_state('input_boolean.motion_detection_toggle_area1', 'on') }}"
        turn_on:
          - service: input_boolean.turn_on
            entity_id: input_boolean.motion_detection_toggle_area1
        turn_off:
          - service: input_boolean.turn_off
            entity_id: input_boolean.motion_detection_toggle_area1
        icon_template: >
          {% if is_state('input_boolean.motion_detection_toggle_area1', 'on') %}
            mdi:motion-sensor
          {% else %}
            mdi:motion-sensor-off
          {% endif %}