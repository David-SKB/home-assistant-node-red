automation:
  - id: calculate_average_motion_detection_interval_area1
    alias: "Calculate Average Motion Detection Interval Area 1"
    trigger:
      - platform: state
        entity_id: binary_sensor.motion_detectors_area1
        to: "on"
      - platform: state
        entity_id: binary_sensor.motion_detectors_area1
        to: "off"
    action:
      - service: rest_command.get_motion_history
        data:
          timestamp: >
            {% set context_window_minutes = state_attr('sensor.motion_lighting_auto_context_window_area1', 'minutes') | float(300) %}
            {{ (now() - timedelta(minutes=context_window_minutes)).isoformat() }}
          entity_id: "binary_sensor.motion_detectors_area1"
        response_variable: motion_history
      - variables:
          motion_history_content: >
            {% if motion_history and motion_history.content %}
              {{ motion_history.content[0] }}
            {% else %}
              []
            {% endif %}
          motion_states: >
            {% set raw_states = motion_history_content %}
            {% set on_states = raw_states
              | selectattr('state', 'eq', 'on')
              | list %}
            {% set motion_times = on_states 
              | map(attribute='last_changed') 
              | map('as_datetime') 
              | map('as_timestamp')
              | list %}
            {{ motion_times }}
          intervals: >
            {% set ns = namespace(intervals=[]) %}
            {% for i in range(1, motion_states | length) %}
              {% set prev = motion_states[i-1] %}
              {% set curr = motion_states[i] %}
              {% set ns.intervals = ns.intervals + [(curr | float) - (prev | float)] %}
            {% endfor %}
            {{ ns.intervals }}
          motion_durations: >
            {% set raw_states = motion_history_content %}
            {% set ns = namespace(motion_durations=[]) %}
            {% for i in range(1, raw_states | length) %}
              {% set current_state = raw_states[i] %}
              {% set prev_state = raw_states[i-1] %}
              {% if current_state.state == 'off' and prev_state.state == 'on' %}
                {% set duration = (current_state.last_changed | as_datetime) - (prev_state.last_changed | as_datetime) %}
                {% set ns.motion_durations = ns.motion_durations + [duration.total_seconds()] %}
              {% endif %}
            {% endfor %}
            {{ ns.motion_durations }}
          avg_interval: >
            {% if intervals | length > 0 %}
              {{ (intervals | sum / intervals | length) | round(2) }}
            {% else %}
              0
            {% endif %}
          min_timeout: >
            {% set min_timeout_helper = state_attr('sensor.motion_lighting_auto_minimum_timeout_area1', 'seconds') | float(0) %}
            {% set min_timeout_value = min_timeout_helper 
              if min_timeout_helper > 0 
              else state_attr('sensor.occupancy_timeout', 'seconds') 
              | default(300) 
              | float 
            %}
            {% if intervals | length > 0 %}
              {% set current_min = intervals | min | float %}
              {{ [current_min, min_timeout_value] | min }}
            {% else %}
              {{ min_timeout_value }}
            {% endif %}
          max_timeout: >
            {% set max_timeout_value = state_attr('sensor.occupancy_timeout', 'seconds') %}
            {% if max_timeout_value is defined %}
              {{ max_timeout_value | float(0) }}
            {% else %}
              unknown
            {% endif %}
          avg_duration: >
            {% if motion_durations | length > 0 %}
              {{ (motion_durations | sum) / motion_durations | length | round(2) }}
            {% else %}
              0
            {% endif %}
          context_window: >
            {% set avg_duration = state_attr('sensor.average_motion_detection_duration_area1', 'seconds') | float(0) %}
            {% set avg_interval = state_attr('sensor.average_motion_detection_interval_area1', 'seconds') | float(0) %}
            {% set min_window = 300 %}
            {% set max_window = 3600 %}
            {% set window_range = (max_window - min_window) %}
            {% set normalized_duration = (avg_duration / window_range) if window_range > 0 else 0 %}
            {% set normalized_duration = normalized_duration if normalized_duration < 1 else 1 %}
            {% set scaled_addition = normalized_duration * window_range %}
            {% set final_window = min_window + scaled_addition %}
            {{ final_window if final_window < max_window else max_window }}
      - service: input_number.set_value
        data:
          entity_id: input_number.average_motion_detection_interval_area1
          value: "{{ avg_interval }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.motion_lighting_auto_minimum_timeout_area1
          value: "{{ min_timeout }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.motion_lighting_auto_maximum_timeout_area1
          value: "{{ max_timeout }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.average_motion_detection_duration_area1
          value: "{{ avg_duration }}"
      - service: input_number.set_value
        data:
          entity_id: input_number.motion_lighting_auto_context_window_area1
          value: "{{ context_window }}"